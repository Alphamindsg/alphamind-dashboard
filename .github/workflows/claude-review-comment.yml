name: Claude Exact-Head Review Request

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Resolve exact candidate PR
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          EXPECTED_BRANCH: copilot/notify-001-shared-telegram-gateway
        run: |
          set -euo pipefail
          test "$COMMENT_USER" = "$GITHUB_REPOSITORY_OWNER"
          [[ "$COMMENT_BODY" =~ ^@claude[[:space:]]+review[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$ ]]
          requested_sha="${BASH_REMATCH[1],,}"
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          candidate_number="$(jq -r '.number' <<< "$pr_json")"
          candidate_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          candidate_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          candidate_branch="$(jq -r '.head.ref' <<< "$pr_json")"
          test "$candidate_repo" = "$GITHUB_REPOSITORY"
          test "$candidate_branch" = "$EXPECTED_BRANCH"
          test "$candidate_sha" = "$requested_sha"
          printf 'number=%s\nsha=%s\n' "$candidate_number" "$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Require Claude OAuth configuration
        id: auth
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Claude independent review is REQUIRED but CLAUDE_CODE_OAUTH_TOKEN is not configured."
            exit 1
          fi
      - name: Run independent Claude review
        if: steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude review"
          allowed_bots: Copilot
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.candidate.outputs.number }}
            EXACT HEAD SHA: ${{ steps.candidate.outputs.sha }}
            Review the exact PR head independently. Do not modify code, merge, deploy,
            authorize capital or production changes, or weaken gates. Report verified
            defects, probable defects, CI problems, missing coverage, and release
            blockers with severity and exact evidence. Finish with exactly one:
            PASS, PASS WITH CONDITIONS, or FAIL. Post one concise top-level review.
          claude_args: |
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
