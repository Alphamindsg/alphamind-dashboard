name: Claude Independent PR Review

# Integrated from Alphamindsg/alphamind-dashboard#24 at
# automation/claude-review-bridge@df1aca2ac9c845e21f4118ccdf31323db1ef48c5.
# This feature branch integration does not modify PR #24.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Resolve exact candidate PR
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_BRANCH: copilot/notify-001-shared-telegram-gateway
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request_review ]; then
            test "$REVIEW_USER" = "$GITHUB_REPOSITORY_OWNER"
            [[ "$REVIEW_BODY" =~ ^@claude[[:space:]]+review[[:space:]]+([0-9a-fA-F]{40})[[:space:]]*$ ]]
            requested_sha="${BASH_REMATCH[1],,}"
            test "$PR_REPO" = "$GITHUB_REPOSITORY"
            test "$PR_HEAD_REF" = "$EXPECTED_BRANCH"
            test "$REVIEW_SHA" = "$requested_sha"
            candidate_number="$REVIEW_PR_NUMBER"
            candidate_sha="$REVIEW_SHA"
          else
            test "$PR_REPO" = "$GITHUB_REPOSITORY"
            test "$PR_HEAD_REF" = "$EXPECTED_BRANCH"
            candidate_number="$PR_NUMBER"
            candidate_sha="$PR_SHA"
          fi
          test -n "$candidate_number"
          test -n "$candidate_sha"
          printf 'number=%s\nsha=%s\n' "$candidate_number" "$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact PR head
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact candidate checkout
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Require Claude OAuth configuration
        id: auth
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Claude OAuth configuration detected; running independent review."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Claude independent review is REQUIRED but CLAUDE_CODE_OAUTH_TOKEN is not configured."
            exit 1
          fi
      - name: Run independent Claude review
        if: steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude review"
          allowed_bots: Copilot
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.candidate.outputs.number }}
            EXACT HEAD SHA: ${{ steps.candidate.outputs.sha }}
            Review the exact PR head independently. Do not modify code, merge, deploy,
            authorize capital or production changes, or weaken gates. Report verified
            defects, probable defects, CI problems, missing coverage, and release
            blockers with severity and exact evidence. Finish with exactly one:
            PASS, PASS WITH CONDITIONS, or FAIL. Post one concise top-level review.
          claude_args: |
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*)"
