name: Verify Portfolio Maturity Contract

on:
  pull_request:
    paths:
      - "docs/contracts/portfolio-maturity-v1.schema.json"
      - "portfolio-maturity-validator.js"
      - "test/portfolio-maturity-regression-checks.js"
      - ".github/workflows/portfolio-maturity.yml"
  push:
    branches:
      - "feature/portfolio-outcome-maturity-contracts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Parse schema
        run: node -e "JSON.parse(require('node:fs').readFileSync('docs/contracts/portfolio-maturity-v1.schema.json','utf8'))"

      - name: Run deterministic regression checks
        run: node test/portfolio-maturity-regression-checks.js
