name: Evidence Pilot CI

on:
  pull_request:
  push:
    branches:
      - codex/shared-skills-evidence-pilot

permissions:
  contents: read

concurrency:
  group: evidence-pilot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          printf 'exact_head=%s\n' "$EXPECTED_HEAD_SHA"

      - name: Generate fail-closed exact-candidate evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$(mktemp -d)"
          set +e
          python3 .agents/skills/alphamind-evidence/scripts/evidence.py collect-dashboard \
            --repo "$GITHUB_WORKSPACE" \
            --out "$evidence_dir" \
            --baseline "$BASELINE_SHA" > "$RUNNER_TEMP/release-evidence-result.json"
          result=$?
          set -e
          cat "$RUNNER_TEMP/release-evidence-result.json"
          test "$result" -eq 2
          test -s "$evidence_dir/bundle.json"
          python3 -c 'import json,sys; b=json.load(open(sys.argv[1],encoding="utf-8")); assert b["candidate_sha"]==sys.argv[2]; assert b["production_authorization"]["status"]=="NOT_REQUESTED"' "$evidence_dir/bundle.json" "$EXPECTED_HEAD_SHA"
          {
            echo "## Exact-candidate Release Evidence"
            echo
            cat "$RUNNER_TEMP/release-evidence-result.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run evidence collector and validator tests
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s .agents/skills/alphamind-evidence/tests -v

      - name: Run existing Dashboard checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check memory-engine.js
          node --check command-center-regression-checks.js
          node command-center-regression-checks.js
          node memory-mvp-regression-checks.js
          node security-regression-checks.js
          git diff --check

      - name: Record verification boundary
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            'This workflow provides exact-head engineering verification only.' \
            'It does not grant release, merge, deployment, production, financial, publishing, or trading authority.'
