name: Notification Gateway Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$EXPECTED_HEAD" = "$(git rev-parse HEAD)"
      - name: Run offline checks
        run: |
          python3 -m unittest notification_gateway.test_gateway
          node command-center-regression-checks.js
          node memory-mvp-regression-checks.js
          node security-regression-checks.js
