name: Notification Gateway Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout head
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$EXPECTED_HEAD" = "$(git rev-parse HEAD)"
          if test "$GITHUB_EVENT_NAME" = push; then test "$GITHUB_SHA" = "$(git rev-parse HEAD)"; fi
      - name: Verify required notification artifacts
        run: |
          set -euo pipefail
          required_paths=(
            ".github/workflows/notification-gateway.yml"
            "telegram-gateway-regression-checks.py"
            "notification_gateway/__init__.py"
            "notification_gateway/__main__.py"
            "notification_gateway/adapters.py"
            "notification_gateway/gateway.py"
            "notification_gateway/report.py"
            "notification_gateway/telegram_ui.py"
            "notification_gateway/test_gateway.py"
            "notification_gateway/test_report.py"
            "notification_gateway/test_claude_workflow.py"
            "notification_gateway/test_notification_workflow.py"
            "notification_gateway/test_telegram_ui.py"
          )
          missing=0
          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Missing required notification artifact: $path"
              missing=1
            fi
          done
          if ! ls notification_gateway/*.py >/dev/null 2>&1; then
            echo "::error::Missing required Python sources under notification_gateway/"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Run offline checks
        timeout-minutes: 5
        run: |
          python3 -m py_compile notification_gateway/*.py
          python3 -m unittest notification_gateway.test_gateway
          python3 -m unittest notification_gateway.test_report
          python3 -m unittest notification_gateway.test_claude_workflow
          python3 -m unittest notification_gateway.test_notification_workflow
          python3 -m unittest notification_gateway.test_telegram_ui
          python3 telegram-gateway-regression-checks.py
          node --check app.js
          node --check memory-engine.js
          node --check command-center-regression-checks.js
          node command-center-regression-checks.js
          node memory-mvp-regression-checks.js
          node security-regression-checks.js
          git diff --check
