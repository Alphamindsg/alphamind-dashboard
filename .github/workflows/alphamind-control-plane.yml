name: Verify AlphaMind Control Plane

on:
  pull_request:
    paths:
      - "alphamind-*.js"
      - "docs/contracts/**"
      - "test/fixtures/**"
      - ".github/workflows/alphamind-control-plane.yml"
  push:
    branches:
      - "feature/alphamind-investment-core-contracts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphamind-control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Record exact head
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD

      - name: Parse contracts and fixtures
        run: |
          node -e "const fs=require('node:fs'); ['docs/contracts/bot-control-plane-v1.schema.json','docs/contracts/alphamind-research-envelope-v1.schema.json','test/fixtures/control-plane-valid.json','test/fixtures/control-plane-invalid.json'].forEach((file)=>JSON.parse(fs.readFileSync(file,'utf8')))"

      - name: Authority policy regression checks
        run: node alphamind-authority-policy-regression-checks.js

      - name: Control-plane invariant checks
        run: node alphamind-control-plane-regression-checks.js
